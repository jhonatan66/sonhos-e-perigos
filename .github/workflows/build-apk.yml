name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extrair projeto
        run: unzip -q Sonhos_e_Perigos_Android.zip -d projeto

      - name: Copiar configurações AndroidX
        run: cp gradle.properties projeto/gradle.properties

      - name: Corrigir Java 1.8 para Java 17
        run: |
          python3 - <<'PY'
          from pathlib import Path

          arquivo = Path("projeto/app/build.gradle.kts")
          texto = arquivo.read_text()

          configuracao = '''
          
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          '''

          texto += configuracao
          arquivo.write_text(texto)
          PY

      - name: Corrigir AndroidManifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          arquivo = Path("projeto/app/src/main/AndroidManifest.xml")
          texto = arquivo.read_text()

          texto = texto.replace(
              'android:label="Sonhos & Perigos"',
              'android:label="Sonhos &amp; Perigos"'
          )

          arquivo.write_text(texto)
          PY

      - name: Adicionar Material3
        run: |
          python3 - <<'PY'
          from pathlib import Path

          arquivo = Path("projeto/app/build.gradle.kts")
          texto = arquivo.read_text()

          dep = 'implementation("com.google.android.material:material:1.13.0")'

          if dep not in texto:
              texto = texto.replace(
                  "dependencies {",
                  f"dependencies {{\n    {dep}",
                  1
              )

          arquivo.write_text(texto)
          PY

      - name: Compilar APK
        working-directory: projeto
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonhos-e-Perigos-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
